/* ---------- 自测量容器（替代 ResponsiveContainer，避免 transform:scale 下 ResizeObserver 不触发） ---------- */
function AutoBox({ children }){
  const ref = useRef(null);
  const [size, setSize] = useState({ w: 0, h: 0 });
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const measure = () => {
      const w = Math.round(el.clientWidth), h = Math.round(el.clientHeight);
      setSize((p) => (p.w === w && p.h === h) ? p : { w, h });
    };
    measure();
    let ro;
    if (typeof ResizeObserver !== 'undefined') { ro = new ResizeObserver(measure); ro.observe(el); }
    window.addEventListener('resize', measure);
    const t = setTimeout(measure, 60);
    return () => { ro && ro.disconnect(); window.removeEventListener('resize', measure); clearTimeout(t); };
  }, []);
  return (
    <div ref={ref} style={{ width: '100%', height: '100%' }}>
      {size.w > 0 && size.h > 0 ? children(size.w, size.h) : null}
    </div>
  );
}

/* ---------- 玻璃卡片外壳（与主屏同款） ---------- */
function GlowCard({ title, en, extra, children, className, bodyClass }){
  return (
    <div className={"glass flex flex-col " + (className || "")}>
      <div className="card-title">
        <span className="dot"></span>
        <h3>{title}</h3>
        {en ? <span className="title-en">{en}</span> : null}
        <div className="ml-auto">{extra}</div>
      </div>
      <div className={"flex-1 min-h-0 px-3.5 pb-3 pt-2 " + (bodyClass || "")}>
        {children}
      </div>
    </div>
  );
}

/* ---------- 分段切换按钮组 ---------- */
function SegSwitch({ options, value, onChange }){
  return (
    <div className="flex">
      {options.map((o) => (
        <button key={o.v} className={"seg-btn" + (value === o.v ? " on" : "")}
          onClick={() => onChange(o.v)}>{o.label}</button>
      ))}
    </div>
  );
}

/* ---------- 涨跌徽标（invert: 数值下降为好） ---------- */
function Delta({ delta, size }){
  if (delta == null) return null;
  const up = delta >= 0;
  // 能耗场景：下降为好（绿色），上升为预警（橙色）
  const col = Math.abs(delta) < 0.05 ? 'var(--txt-dim)' : (up ? 'var(--orange)' : 'var(--green)');
  return (
    <span className="num inline-flex items-center gap-0.5 font-semibold" style={{ color: col, fontSize: size || 11 }}>
      {up ? '▲' : '▼'}{Math.abs(delta).toFixed(1)}%
    </span>
  );
}

function TopBar({ now }){
  const date = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  const time = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

          <div className="num text-[22px] font-bold" style={{ color: 'var(--cyan)' }}>{time}</div>
          <div className="num text-[12px]" style={{ color: 'var(--txt-dim)' }}>{date} {week}</div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Tab 1：系统态势（电/水切换 + 6 KPI + 24h 双线趋势 + 能耗排行）
   ============================================================ */

/* ---- KPI 卡片 ---- */
function KpiCard({ label, en, value, unit, color, hint, blink }){
  return (
    <div className="glass flex-1 flex flex-col justify-center px-5 py-3">
      <div className="flex items-center gap-2">
        <span className={"w-1.5 h-1.5 rounded-full" + (blink ? " blink" : "")} style={{ background: color, boxShadow: '0 0 6px ' + color }}></span>
        <span className="text-[13px]" style={{ color: 'var(--txt)' }}>{label}</span>
        <span className="title-en">{en}</span>
      </div>
      <div className="num text-[30px] font-bold leading-none glow-text mt-2.5" style={{ color }}>
        {fmt(value)}<span className="text-[13px] ml-1 font-medium" style={{ color: 'var(--txt-dim)' }}>{unit}</span>
      </div>
      <div className="mt-2">{hint}</div>
    </div>
  );
}

function OverviewTab({ ov }){
  const [kind, setKind] = useState('elec');                       // 电 / 水 切换
  const cur = ov[kind];
  const color = kind === 'elec' ? 'var(--blue)' : 'var(--cyan)';
  // 环比提示：今日 vs 昨日 / 本月 vs 上月
  const dDay = cur.yesterday ? ((cur.today - cur.yesterday) / cur.yesterday) * 100 : 0;
  const dMonth = cur.lastMonth ? ((cur.month - cur.lastMonth) / cur.lastMonth) * 100 : 0;
  const rankMax = Math.max(...ov.rank.map((r) => r.v), 1);
  const rankTotal = ov.rank.reduce((a, b) => a + b.v, 0);

  return (
    <div className="h-full flex flex-col gap-3">
      {/* 电 / 水 切换 */}
      <div className="flex items-center justify-between shrink-0">
        <SegSwitch value={kind} onChange={setKind}
          options={[{ v: 'elec', label: '⚡ 电能' }, { v: 'water', label: '💧 水量' }]} />
        <span className="num text-[11px]" style={{ color: 'var(--txt-dim)' }}>单位：{cur.unit} · 每 5 秒刷新</span>
      </div>

      {/* 6 个 KPI 卡：今日实时 / 预计全天 / 昨日 / 本月 / 上月 / 本年 */}
      <div className="flex gap-3 shrink-0" style={{ height: 136 }}>
        <KpiCard label="今日实时" en="Today" value={cur.today} unit={cur.unit} color={color} blink
          hint={<span className="text-[11px]" style={{ color: 'var(--txt-dim)' }}>较昨日 <Delta delta={dDay} /></span>} />
        <KpiCard label="预计全天" en="Predict" value={cur.predict} unit={cur.unit} color="var(--violet)"
          hint={<span className="text-[11px]" style={{ color: 'var(--txt-dim)' }}>AI 负荷预测</span>} />
        <KpiCard label="昨日" en="Yesterday" value={cur.yesterday} unit={cur.unit} color="var(--txt)"
          hint={<span className="text-[11px]" style={{ color: 'var(--txt-dim)' }}>昨日全天累计</span>} />
        <KpiCard label="本月" en="Month" value={cur.month} unit={cur.unit} color="var(--green)"
          hint={<span className="text-[11px]" style={{ color: 'var(--txt-dim)' }}>较上月 <Delta delta={dMonth} /></span>} />
        <KpiCard label="上月" en="Last Month" value={cur.lastMonth} unit={cur.unit} color="var(--orange)"
          hint={<span className="text-[11px]" style={{ color: 'var(--txt-dim)' }}>上月全月累计</span>} />
        <KpiCard label="本年" en="Year" value={cur.year} unit={cur.unit} color="var(--magenta)"
          hint={<span className="text-[11px]" style={{ color: 'var(--txt-dim)' }}>年度累计用量</span>} />
      </div>

      {/* 下方：24h 双线趋势大图 + 右侧能耗排行 */}
      <div className="flex-1 min-h-0 flex gap-3">
        <GlowCard title="水电 24 小时趋势" en="24H Trend" className="flex-1"
          extra={<span className="num text-[11px]" style={{ color: 'var(--txt-dim)' }}>
            <span style={{ color: 'var(--blue)' }}>━ 电 kWh</span>　<span style={{ color: 'var(--cyan)' }}>━ 水 m³</span>
          </span>}>
          <AutoBox>{(w, h) => (
            <LineChart width={w} height={h} data={ov.trend24h} margin={{ top: 8, right: 6, bottom: 0, left: -14 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(43,127,255,.16)" />
              <XAxis dataKey="t" tick={axisStyle} tickLine={false} axisLine={{ stroke: 'rgba(43,127,255,.3)' }} interval={1} />
              <YAxis yAxisId="e" tick={axisStyle} tickLine={false} axisLine={false} />
              <YAxis yAxisId="w" orientation="right" tick={axisStyle} tickLine={false} axisLine={false} width={44} />
              <Tooltip />
              <Line yAxisId="e" type="monotone" dataKey="elec" name="电 (kWh)" stroke="#2b7fff" strokeWidth={2.4}
                dot={false} activeDot={{ r: 4 }} style={{ filter: 'drop-shadow(0 0 4px #2b7fff)' }} />
              <Line yAxisId="w" type="monotone" dataKey="water" name="水 (m³)" stroke="#0a93c9" strokeWidth={2.4}
                dot={false} activeDot={{ r: 4 }} strokeDasharray="6 3" style={{ filter: 'drop-shadow(0 0 4px #0a93c9)' }} />
            </LineChart>
          )}</AutoBox>
        </GlowCard>

        <GlowCard title="能耗排行" en="Ranking" className="w-[520px] shrink-0"
          extra={<span className="num text-[11px]" style={{ color: 'var(--txt-dim)' }}>合计 <b style={{ color: 'var(--cyan)' }}>{fmt(rankTotal)}</b> kWh</span>}>
          <AutoBox>{(w, h) => (
            <BarChart width={w} height={h} data={ov.rank} layout="vertical" margin={{ top: 6, right: 44, bottom: 0, left: 4 }} barSize={18}>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(43,127,255,.14)" horizontal={false} />
              <XAxis type="number" domain={[0, Math.ceil(rankMax * 1.15)]} tick={axisStyle} tickLine={false} axisLine={false} />
              <YAxis type="category" dataKey="name" tick={{ fontSize: 13, fill: '#123c6e' }} tickLine={false} axisLine={false} width={52} />
              <Tooltip />
              <Bar dataKey="v" name="能耗 (kWh)" radius={[0, 9, 9, 0]}
                label={{ position: 'right', fontSize: 12, fontFamily: 'Oxanium', fill: '#123c6e' }}>
                {ov.rank.map((_, i) => (
                  <Cell key={i} fill={PALETTE[i % PALETTE.length]} style={{ filter: 'drop-shadow(0 0 4px ' + PALETTE[i % PALETTE.length] + ')' }} />
                ))}
              </Bar>
            </BarChart>
          )}</AutoBox>
        </GlowCard>
      </div>
    </div>
  );
}

/* ============================================================
   Tab 2：能耗分析（维度 + 周期切换：同环比双柱 / 占比环形 / 本期上期对比）

        <div className="flex items-center gap-2">
          <span className="text-[13px]" style={{ color: 'var(--txt-dim)' }}>分析维度</span>
          <SegSwitch value={dim} onChange={setDim}

                  <Tooltip />

                <PieChart width={w} height={h}>
                  <Pie data={data.share} dataKey="v" nameKey="name" cx="50%" cy="50%"
                    innerRadius={Math.min(w, h) * 0.26} outerRadius={Math.min(w, h) * 0.4}

              <linearGradient id="gCur" x1="0" y1="0" x2="0" y2="1">

                <stop offset="100%" stopColor="#2b7fff" stopOpacity="0" />

              <linearGradient id="gPrev" x1="0" y1="0" x2="0" y2="1">

            </defs>
            <CartesianGrid strokeDasharray="3 3" stroke="rgba(43,127,255,.16)" vertical={false} />

              fill="url(#gCur)" dot={false} activeDot={{ r: 4 }} style={{ filter: 'drop-shadow(0 0 4px #2b7fff)' }} />
          </AreaChart>
        )}</AutoBox>
      </GlowCard>
    </div>
  );

/* ============================================================
   Tab 3：仪表监测（表具卡片网格：电压/电流/功率/流量 + 状态徽标）
   ============================================================ */
const METER_STATUS_COLOR = { '正常': 'var(--green)', '离线': '#6f93b8', '故障': 'var(--red)' };

/* ---- 单个运行参数 ---- */
function MeterParam({ label, value, unit }){
  return (
    <div className="rounded px-2 py-1.5" style={{ background: 'rgba(20,60,110,.06)' }}>
      <div className="text-[10px]" style={{ color: 'var(--txt-dim)' }}>{label}</div>
      <div className="num text-[16px] font-bold leading-tight" style={{ color: value == null ? 'var(--txt-dim)' : 'var(--cyan)' }}>
        {value == null ? '--' : value}<span className="text-[9px] ml-0.5 font-medium" style={{ color: 'var(--txt-dim)' }}>{unit}</span>
      </div>
    </div>
  );
}

function MeterCard({ m }){
  const col = METER_STATUS_COLOR[m.status] || 'var(--txt-dim)';
  const isElec = m.kind === '电表';
  return (
    <div className="glass p-3 flex flex-col gap-2">
      <div className="flex items-center gap-2">
        <span className="text-[16px]">{isElec ? '⚡' : '💧'}</span>
        <div className="min-w-0 flex-1">
          <div className="text-[13px] font-bold truncate" style={{ color: 'var(--txt)' }}>{m.name}</div>
          <div className="num text-[10px]" style={{ color: 'var(--txt-dim)' }}>{m.id} · {m.zone}</div>
        </div>
        {/* 状态徽标 */}
        <span className="text-[11px] px-2 py-0.5 rounded-full shrink-0"
          style={{ color: col, background: 'rgba(20,60,110,.07)', border: '1px solid ' + col }}>
          <span className={m.status === '正常' ? 'blink' : ''}>●</span> {m.status}
        </span>
      </div>
      {/* 实时参数：电表显示电压/电流/功率，水表显示流量 */}
      <div className="grid grid-cols-3 gap-1.5">
        {isElec ? (
          <React.Fragment>
            <MeterParam label="电压" value={m.params.voltage} unit="V" />
            <MeterParam label="电流" value={m.params.current} unit="A" />
            <MeterParam label="功率" value={m.params.power} unit="kW" />
          </React.Fragment>
        ) : (
          <React.Fragment>
            <MeterParam label="瞬时流量" value={m.params.flow} unit="m³/h" />
            <MeterParam label="电压" value={null} unit="V" />
            <MeterParam label="功率" value={null} unit="kW" />
          </React.Fragment>
        )}
      </div>
      {/* 当前示数 */}
      <div className="flex items-center justify-between text-[11px] pt-1" style={{ borderTop: '1px dashed rgba(43,127,255,.2)' }}>
        <span style={{ color: 'var(--txt-dim)' }}>当前示数</span>
        <span className="num text-[14px] font-bold" style={{ color: 'var(--blue)' }}>
          {fmt(m.reading)}<span className="text-[9px] ml-0.5 font-medium" style={{ color: 'var(--txt-dim)' }}>{isElec ? 'kWh' : 'm³'}</span>
        </span>
      </div>
    </div>
  );
}

function MetersTab({ meters }){
  const [filter, setFilter] = useState('all');                    // 表具类型筛选
  const list = meters.filter((m) => filter === 'all' || m.kind === filter);
  const normal = meters.filter((m) => m.status === '正常').length;
  return (
    <div className="h-full flex flex-col gap-3">
      <div className="flex items-center justify-between shrink-0">
        <SegSwitch value={filter} onChange={setFilter}
          options={[{ v: 'all', label: '全部' }, { v: '电表', label: '⚡ 电表' }, { v: '水表', label: '💧 水表' }]} />
        <span className="num text-[11px]" style={{ color: 'var(--txt-dim)' }}>
          接入表具 <b style={{ color: 'var(--cyan)' }}>{meters.length}</b> 块 · 正常 <b style={{ color: 'var(--green)' }}>{normal}</b> 块
        </span>
      </div>
      <div className="flex-1 min-h-0 overflow-y-auto scrollbar pr-1">
        <div className="grid grid-cols-4 gap-3">
          {list.map((m) => <MeterCard key={m.id} m={m} />)}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Tab 4：抄表记录（时间段筛选 + 表格）

        </div>
        <span className="num text-[11px]" style={{ color: 'var(--txt-dim)' }}>
          共 <b style={{ color: 'var(--cyan)' }}>{readings.length}</b> 条 ·
          电累计 <b style={{ color: 'var(--blue)' }}>{fmt(+elecUsage.toFixed(1))}</b> kWh ·

        <div className="grid text-[12px] font-bold py-2 px-2 shrink-0"

                <span className="text-[11px] px-2 py-0.5 rounded-full"
                  style={{
                    color: r.kind === '电表' ? 'var(--blue)' : 'var(--cyan)',
                    background: 'rgba(20,60,110,.07)',

                  }}>{r.kind === '电表' ? '⚡' : '💧'} {r.kind}</span>
              </span>
              <span className="num text-right" style={{ color: 'var(--txt-dim)' }}>{fmt(r.start)}</span>
              <span className="num text-right" style={{ color: 'var(--txt-dim)' }}>{fmt(r.end)}</span>
              <span className="num text-right font-bold" style={{ color: r.kind === '电表' ? 'var(--blue)' : 'var(--cyan)' }}>
                {fmt(r.usage)}<span className="text-[10px] ml-0.5 font-medium" style={{ color: 'var(--txt-dim)' }}>{r.kind === '电表' ? 'kWh' : 'm³'}</span>
              </span>
              <span className="num text-right pr-2" style={{ color: 'var(--txt)' }}>{r.date}</span>

          ))}

function App(){

  const [ov, setOv] = useState(MOCK_OVERVIEW);
  const [analysis, setAnalysis] = useState(MOCK_ANALYSIS);
  const [meters, setMeters] = useState(MOCK_METERS);
  const [readings, setReadings] = useState(MOCK_READINGS);

  // 能耗分析筛选条件
  const [dim, setDim] = useState('item');        // item | building | function
  const [period, setPeriod] = useState('day');   // day | month | year
  // 抄表记录时间段
  const [days, setDays] = useState(7);

  // 时钟：每秒更新
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  // 系统态势 overview：每 5 秒轮询（核心数据，失败静默走 mock）
  useEffect(() => {
    const load = () => {
      fetch('api/v1/energy/overview')
        .then((r) => r.json())
        .then((d) => { if (d && d.elec && d.trend24h) setOv(d); })
        .catch(() => {});
    };
    load();
    const t = setInterval(load, 5000);
    return () => clearInterval(t);
  }, []);

  // 能耗分析：Tab 激活或 维度/周期 变化时拉取
  useEffect(() => {
    if (tab !== 'analysis') return;
    fetch('api/v1/energy/analysis?dim=' + dim + '&period=' + period)
      .then((r) => r.json())
      .then((d) => { if (d && d.compare) setAnalysis(d); })
      .catch(() => {});
  }, [tab, dim, period]);

  // 仪表监测：Tab 激活时拉取
  useEffect(() => {
    if (tab !== 'meters') return;
    fetch('api/v1/energy/meters')
      .then((r) => r.json())
      .then((d) => { if (Array.isArray(d) && d.length) setMeters(d); })
      .catch(() => {});
  }, [tab]);

  // 抄表记录：Tab 激活或时间段变化时拉取
  useEffect(() => {
    if (tab !== 'readings') return;
    fetch('api/v1/energy/readings?days=' + days)
      .then((r) => r.json())
      .then((d) => { if (Array.isArray(d) && d.length) setReadings(d); })
      .catch(() => {});
  }, [tab, days]);

  return (
    <div className="h-full flex flex-col">
      <TopBar now={now} />

      {/* Tab 切换行 */}
      <div className="flex items-center justify-center gap-4 py-2.5 shrink-0">
        {TABS.map((t) => (
          <button key={t.key} className={"tab-btn" + (tab === t.key ? " on" : "")}
            onClick={() => setTab(t.key)}>{t.label}</button>
        ))}
      </div>

      {/* Tab 内容区 */}
      <div className="flex-1 min-h-0 px-5 pb-5 pt-1">
        {tab === 'overview' && <OverviewTab ov={ov} />}
        {tab === 'analysis' && <AnalysisTab data={analysis} dim={dim} setDim={setDim} period={period} setPeriod={setPeriod} />}
        {tab === 'meters'   && <MetersTab meters={meters} />}
        {tab === 'readings' && <ReadingsTab readings={readings} days={days} setDays={setDays} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
