/* ---------- 自测量容器（替代 ResponsiveContainer，避免 transform:scale 下 ResizeObserver 不触发） ---------- */
function AutoBox({ children }){
  const ref = useRef(null);
  const [size, setSize] = useState({ w: 0, h: 0 });
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const measure = () => {
      const w = Math.round(el.clientWidth), h = Math.round(el.clientHeight);
      setSize((p) => (p.w === w && p.h === h) ? p : { w, h });
    };
    measure();
    let ro;
    if (typeof ResizeObserver !== 'undefined') { ro = new ResizeObserver(measure); ro.observe(el); }
    window.addEventListener('resize', measure);
    const t = setTimeout(measure, 60);
    return () => { ro && ro.disconnect(); window.removeEventListener('resize', measure); clearTimeout(t); };
  }, []);
  return (
    <div ref={ref} style={{ width: '100%', height: '100%' }}>
      {size.w > 0 && size.h > 0 ? children(size.w, size.h) : null}
    </div>
  );
}

/* ---------- 卡片外壳（菱形 dot + 中文标题 + 英文小字） ---------- */
function GlowCard({ title, en, extra, children, className, bodyClass }){
  return (
    <div className={"glass flex flex-col " + (className || "")}>
      <div className="card-title">

        {children}

  );
}

/* ---------- 状态徽标 ---------- */
function StatusBadge({ status }){
  const c = STATUS_COLOR[status] || 'var(--txt-dim)';
  return (
    <span className="px-2 py-0.5 rounded text-[11px] font-bold whitespace-nowrap" style={{ color: c, background: c + '22' }}>
      {status}

}

/* ---------- 优先级徽标 ---------- */
function PriorityBadge({ priority }){

}

/* ---------- 处理进度条 ---------- */
function Progress({ value, color }){
  const c = color || (value >= 100 ? 'var(--green)' : 'var(--blue)');
  return (
    <div className="flex items-center gap-2">
      <div className="flex-1 h-1.5 rounded-full overflow-hidden" style={{ background: 'rgba(20,60,110,.1)' }}>

}

   ============================================================ */
function TopBar({ now }){
  const date = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  const time = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][now.getDay()];
  return (
    <div className="relative h-[74px] flex items-center px-5 shrink-0">
      {/* 装饰底线 */}
      <div className="absolute bottom-0 left-0 right-0 h-[2px]" style={{ background: 'linear-gradient(90deg,transparent,rgba(43,127,255,.5),transparent)' }}></div>

      </div>

        <div className="num text-[11px] tracking-[5px]" style={{ color: 'var(--txt-dim)' }}>
          WORK ORDER MANAGEMENT SYSTEM
        </div>
      </div>

      {/* 右：实时时钟 */}

        <div className="leading-tight text-right">
          <div className="num text-[22px] font-bold" style={{ color: 'var(--cyan)' }}>{time}</div>
          <div className="num text-[12px]" style={{ color: 'var(--txt-dim)' }}>{date} {week}</div>

    </div>
  );
}

          <Area type="monotone" dataKey="count" name="工单量" stroke="#2b7fff" strokeWidth={2.2} fill="url(#woTrend)"
            dot={{ r: 2.5, fill: '#2b7fff', strokeWidth: 0 }} activeDot={{ r: 4 }} />
        </AreaChart>
      )}</AutoBox>

}

/* ---------- 类型分布环形 ---------- */
function TypeCard({ data }){
  const total = data.reduce((a, b) => a + b.v, 0);
  return (
    <GlowCard title="工单类型分布" en="By Type" className="flex-1 min-w-0">
      <div className="h-full flex items-center">
        <div className="relative shrink-0" style={{ width: 158, height: 158 }}>
          <PieChart width={158} height={158}>
            <Pie data={data} dataKey="v" nameKey="name" cx="50%" cy="50%" innerRadius={50} outerRadius={68}
              paddingAngle={3} stroke="none" startAngle={90} endAngle={-270}>
              {data.map((e, i) => {
                const c = TYPE_COLOR[e.name] || '#8a4fd6';
                return <Cell key={i} fill={c} style={{ filter: 'drop-shadow(0 0 4px ' + c + ')' }} />;
              })}
            </Pie>
            <Tooltip />
          </PieChart>
          <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
            <div className="num text-[26px] font-bold glow-text" style={{ color: 'var(--cyan)' }}>{total}</div>
            <div className="text-[10px]" style={{ color: 'var(--txt-dim)' }}>本月总量</div>
          </div>
        </div>
        {/* 图例 + 数值 */}
        <div className="flex-1 min-w-0 pl-4 space-y-2.5">
          {data.map((e) => {
            const c = TYPE_COLOR[e.name] || '#8a4fd6';
            const pct = total ? Math.round((e.v / total) * 100) : 0;
            return (
              <div key={e.name} className="flex items-center gap-2 text-[12px]">

                  <div className="h-full rounded-full" style={{ width: pct + '%', background: c, boxShadow: '0 0 6px ' + c }}></div>

                <span className="num text-[13px] font-bold w-7 text-right" style={{ color: c }}>{e.v}</span>
                <span className="num text-[10px] w-8 text-right" style={{ color: 'var(--txt-dim)' }}>{pct}%</span>
              </div>
            );
          })}
        </div>
      </div>

  );
}

/* ============================================================
   Tab 2：报修中心
   ============================================================ */
const REPAIR_TYPES = ['报修', '巡检', '投诉', '其他'];

/* 表单字段外壳（定义在组件外，避免每次渲染重建导致输入框失焦） */
function Field({ label, children }){
  return (
    <div>
      <div className="text-[13px] mb-1.5 flex items-center gap-1" style={{ color: 'var(--txt)' }}>
        <span style={{ color: 'var(--magenta)' }}>*</span>{label}
      </div>
      {children}
    </div>
  );
}

function RepairTab({ d, onCreate }){
  // 发起报修表单状态
  const [form, setForm] = useState({ title: '', location: '', type: '报修', desc: '' });
  const [submitting, setSubmitting] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const submit = () => {
    if (!form.title.trim() || !form.location.trim() || submitting) return;
    setSubmitting(true);
    // 提交报修 → 服务端转工单
    fetch('api/v1/workorders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(form),
    })
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then(() => {
        // 成功：清空表单并刷新列表
        setForm({ title: '', location: '', type: '报修', desc: '' });
        onCreate();
      })
      .catch(() => {})  // 失败静默
      .finally(() => setSubmitting(false));
  };

  // 报修工单列表（取报修/投诉类，按接口顺序即时间倒序）
  const repairs = d.list.filter((o) => o.type === '报修' || o.type === '投诉');
  const canSubmit = form.title.trim() && form.location.trim();

  return (
    <div className="flex-1 min-h-0 flex gap-3">
      {/* 左：发起报修表单 */}
      <GlowCard title="发起报修" en="New Repair" className="w-[560px] shrink-0"
        extra={<span className="text-[11px] px-2 py-0.5 rounded-full" style={{ color: 'var(--cyan)', background: 'rgba(10,147,201,.14)' }}>提交后自动转工单</span>}>
        <div className="h-full flex flex-col gap-4 pt-2">
          <Field label="报修标题">
            <input className="ipt" placeholder="如：3F 茶水间水龙头漏水" value={form.title} onChange={set('title')} maxLength={40} />
          </Field>
          <Field label="所在位置">
            <input className="ipt" placeholder="如：A栋 3F" value={form.location} onChange={set('location')} maxLength={20} />
          </Field>
          <Field label="报修类型">
            <select className="ipt" value={form.type} onChange={set('type')}>
              {REPAIR_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
          </Field>
          <div className="flex-1 min-h-0 flex flex-col">
            <div className="text-[13px] mb-1.5" style={{ color: 'var(--txt)' }}>问题描述</div>
            <textarea className="ipt flex-1 resize-none scrollbar" placeholder="请描述故障现象、发生时间等，便于快速定位处理…"
              value={form.desc} onChange={set('desc')} maxLength={200} style={{ minHeight: 120 }} />
          </div>
          <button onClick={submit}
            className="h-11 rounded-md text-[15px] font-bold transition"
            style={canSubmit && !submitting
              ? { background: 'linear-gradient(135deg,#2b7fff,#0a93c9)', color: '#04101f', boxShadow: '0 0 16px rgba(43,127,255,.45)', cursor: 'pointer' }
              : { background: 'rgba(20,60,110,.12)', color: 'var(--txt-dim)', cursor: 'not-allowed' }}>
            {submitting ? '提交中…' : '提 交 报 修'}
          </button>
        </div>
      </GlowCard>

      {/* 右：报修工单列表 */}
      <GlowCard title="报修工单" en="Repair Orders" className="flex-1 min-w-0"
        extra={<span className="num text-[11px]" style={{ color: 'var(--txt-dim)' }}>共 <b style={{ color: 'var(--cyan)' }}>{repairs.length}</b> 条</span>}
        bodyClass="overflow-y-auto scrollbar">
        <div className="space-y-2.5">
          {repairs.map((o) => (
            <div key={o.id} className="rounded px-4 py-3" style={{ background: 'rgba(20,60,110,.05)', borderLeft: '3px solid ' + (STATUS_COLOR[o.status] || 'var(--cyan)') }}>
              <div className="flex items-center gap-3">
                <span className="num text-[12px]" style={{ color: 'var(--cyan)' }}>{o.id}</span>
                <span className="text-[14px] font-medium flex-1 truncate" style={{ color: 'var(--txt)' }}>{o.title}</span>
                <PriorityBadge priority={o.priority} />
                <StatusBadge status={o.status} />
              </div>
              <div className="flex items-center gap-4 mt-2 text-[12px]" style={{ color: 'var(--txt-dim)' }}>
                <span>📍 {o.location}</span>
                <span>发起：{o.creator}</span>
                <span>处理：{o.assignee || '待派单'}</span>
                <span className="num ml-auto">{o.createdAt}</span>
              </div>
              <div className="mt-2"><Progress value={o.progress} color={STATUS_COLOR[o.status]} /></div>
            </div>
          ))}
        </div>
      </GlowCard>
    </div>
  );
}

   Tab 3：工单中心（全量表格 + 派单 / 完成）

/* ---------- 派单 Modal（玻璃卡片 + 遮罩 + 右上角✕） ---------- */
function DispatchModal({ order, onClose, onConfirm }){
  const [assignee, setAssignee] = useState(ASSIGNEES[0]);
  const [custom, setCustom] = useState('');
  if (!order) return null;
  const finalAssignee = custom.trim() || assignee; // 手填优先于下拉
  return (
    <div className="absolute inset-0 z-50 flex items-center justify-center"
      style={{ background: 'rgba(150,185,225,.45)', backdropFilter: 'blur(2px)' }} onClick={onClose}>
      <div className="glass flex flex-col" style={{ width: 460, borderRadius: 10 }} onClick={(e) => e.stopPropagation()}>
        <div className="card-title">
          <span className="dot"></span>
          <h3>工单派单</h3>
          <span className="title-en">Dispatch</span>
          <button onClick={onClose} className="ml-auto w-7 h-7 rounded flex items-center justify-center text-[16px] transition hover:bg-white/10" style={{ color: 'var(--txt-dim)' }}>✕</button>
        </div>
        <div className="px-4 py-4 space-y-4">
          {/* 工单摘要 */}
          <div className="rounded px-3 py-2.5 text-[13px]" style={{ background: 'rgba(20,60,110,.05)' }}>
            <span className="num" style={{ color: 'var(--cyan)' }}>{order.id}</span>
            <span className="ml-2 font-medium" style={{ color: 'var(--txt)' }}>{order.title}</span>
            <span className="ml-2" style={{ color: 'var(--txt-dim)' }}>{order.location}</span>
          </div>
          <div>
            <div className="text-[13px] mb-1.5" style={{ color: 'var(--txt)' }}>选择处理人</div>
            <select className="ipt" value={assignee} onChange={(e) => setAssignee(e.target.value)}>
              {ASSIGNEES.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
          <div>
            <div className="text-[13px] mb-1.5" style={{ color: 'var(--txt-dim)' }}>或手动输入（优先生效）</div>
            <input className="ipt" placeholder="如：维修三组·孙浩" value={custom} onChange={(e) => setCustom(e.target.value)} maxLength={20} />
          </div>
          <div className="flex justify-end gap-2.5 pt-1">
            <button onClick={onClose} className="px-5 py-2 rounded-md text-[13px] transition hover:bg-white/10"
              style={{ border: '1px solid rgba(43,127,255,.3)', color: 'var(--txt-dim)' }}>取消</button>
            <button onClick={() => onConfirm(order.id, finalAssignee)}
              className="px-5 py-2 rounded-md text-[13px] font-bold"
              style={{ background: 'linear-gradient(135deg,#2b7fff,#0a93c9)', color: '#04101f', boxShadow: '0 0 14px rgba(43,127,255,.4)' }}>
              确认派单
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function CenterTab({ d, onReload }){
  const [dispatching, setDispatching] = useState(null); // 当前待派单的工单对象
  const [filter, setFilter] = useState('全部');
  const s = d.stats;

  // 派单：POST dispatch，id 放 body，成功后刷新并关闭 Modal
  const doDispatch = (id, assignee) => {
    fetch('api/v1/workorders/dispatch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, assignee }),
    })
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then(() => onReload())
      .catch(() => {})  // 失败静默
      .finally(() => setDispatching(null));
  };

  // 完成：POST complete，id 放 body，成功后刷新
  const doComplete = (id) => {
    fetch('api/v1/workorders/complete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) })
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then(() => onReload())
      .catch(() => {});  // 失败静默
  };

  const FILTERS = ['全部', '待派单', '处理中', '已完成'];
  const list = filter === '全部' ? d.list : d.list.filter((o) => o.status === filter);

  return (
    <div className="flex-1 min-h-0 flex flex-col">
      <GlowCard title="工单中心" en="Order Center" className="flex-1 min-h-0"
        extra={
          <div className="flex items-center gap-3">
            <span className="num text-[11px]" style={{ color: 'var(--txt-dim)' }}>
              待派单 <b style={{ color: 'var(--orange)' }}>{s.pending}</b> · 处理中 <b style={{ color: 'var(--blue)' }}>{s.processing}</b> · 已完成 <b style={{ color: 'var(--green)' }}>{s.done}</b>
            </span>
            <div className="flex gap-1">
              {FILTERS.map((f) => (
                <button key={f} onClick={() => setFilter(f)}
                  className="px-3 py-1 rounded text-[12px] transition"
                  style={filter === f
                    ? { background: 'rgba(43,127,255,.2)', color: 'var(--cyan)', fontWeight: 700, border: '1px solid rgba(43,127,255,.4)' }
                    : { color: 'var(--txt-dim)', border: '1px solid transparent' }}>
                  {f}
                </button>
              ))}
            </div>
          </div>
        }
        bodyClass="overflow-y-auto scrollbar">
        <table className="w-full text-[13px]" style={{ borderCollapse: 'separate', borderSpacing: '0 6px' }}>
          <thead>
            <tr style={{ color: 'var(--txt-dim)' }} className="text-left text-[12px]">
              <th className="px-3 font-medium">编号</th><th className="px-3 font-medium">标题</th>
              <th className="px-3 font-medium">类型</th><th className="px-3 font-medium">优先级</th>
              <th className="px-3 font-medium">位置</th><th className="px-3 font-medium">发起人</th>
              <th className="px-3 font-medium">处理人</th><th className="px-3 font-medium w-[150px]">进度</th>
              <th className="px-3 font-medium">状态</th><th className="px-3 font-medium">创建时间</th>
              <th className="px-3 font-medium text-center">操作</th>
            </tr>
          </thead>
          <tbody>
            {list.map((o) => (
              <tr key={o.id} style={{ background: 'rgba(20,60,110,.05)' }}>
                <td className="px-3 py-2.5 num rounded-l" style={{ color: 'var(--cyan)' }}>{o.id}</td>
                <td className="px-3 py-2.5 font-medium max-w-[260px] truncate" style={{ color: 'var(--txt)' }}>{o.title}</td>
                <td className="px-3 py-2.5"><span style={{ color: TYPE_COLOR[o.type] }}>{o.type}</span></td>
                <td className="px-3 py-2.5"><PriorityBadge priority={o.priority} /></td>
                <td className="px-3 py-2.5" style={{ color: 'var(--txt-dim)' }}>{o.location}</td>
                <td className="px-3 py-2.5" style={{ color: 'var(--txt-dim)' }}>{o.creator}</td>
                <td className="px-3 py-2.5" style={{ color: 'var(--txt)' }}>{o.assignee || '—'}</td>
                <td className="px-3 py-2.5"><Progress value={o.progress} color={STATUS_COLOR[o.status]} /></td>
                <td className="px-3 py-2.5"><StatusBadge status={o.status} /></td>
                <td className="px-3 py-2.5 num" style={{ color: 'var(--txt-dim)' }}>{o.createdAt}</td>
                <td className="px-3 py-2.5 rounded-r text-center whitespace-nowrap">
                  {o.status === '待派单' ? (
                    <button onClick={() => setDispatching(o)}
                      className="px-3 py-1 rounded text-[12px] font-medium text-[#04101f]"
                      style={{ background: 'linear-gradient(135deg,#ef8326,#d99a16)', boxShadow: '0 0 10px rgba(239,131,38,.35)' }}>派单</button>
                  ) : o.status === '处理中' ? (
                    <button onClick={() => doComplete(o.id)}
                      className="px-3 py-1 rounded text-[12px] font-medium text-[#04101f]"
                      style={{ background: 'linear-gradient(135deg,#2b7fff,#0a93c9)', boxShadow: '0 0 10px rgba(43,127,255,.35)' }}>完成</button>
                  ) : (
                    <span className="text-[12px]" style={{ color: 'var(--txt-dim)' }}>已归档</span>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </GlowCard>

      {/* 派单弹窗 */}
      <DispatchModal order={dispatching} onClose={() => setDispatching(null)} onConfirm={doDispatch} />
    </div>
  );
}

/* ============================================================
   应用根：时钟 + 5 秒轮询 + Tab 路由
   ============================================================ */
function App(){
  const [d, setD] = useState(initialData);   // 初始 mock 兜底
  const [now, setNow] = useState(new Date());
  const [tab, setTab] = useState('工单概览');

  // 拉取工单数据（失败静默，保留旧数据 / mock）
  const load = () => fetch('api/v1/workorders').then((r) => r.json()).then(setD).catch(() => {});

  // 每秒时钟
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  // 工单数据每 5 秒轮询
  useEffect(() => {
    load();
    const t = setInterval(load, 5000);
    return () => clearInterval(t);
  }, []);

  return (
    <div className="absolute inset-0 flex flex-col">
      <TopBar now={now} />
      <TabBar tab={tab} onChange={setTab} />
      <div className="flex-1 min-h-0 flex flex-col px-5 pt-3 pb-5">
        {tab === '工单概览' ? <OverviewTab d={d} /> : null}
        {tab === '报修中心' ? <RepairTab d={d} onCreate={load} /> : null}
        {tab === '工单中心' ? <CenterTab d={d} onReload={load} /> : null}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
